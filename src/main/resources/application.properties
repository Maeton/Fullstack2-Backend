spring.application.name=huerto-hogar-backend
server.port=8080

# Base de datos H2 en modo archivo para desarrollo y demo
spring.datasource.url=jdbc:h2:file:./data/huertohogar;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Consola H2 solo para desarrollo
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Swagger / OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# JWT
app.jwt.secret=${JWT_SECRET:huerto-hogar-dev-secret-key-change-in-production-2026}
app.jwt.expiration-ms=900000
app.jwt.refresh-expiration-ms=604800000
